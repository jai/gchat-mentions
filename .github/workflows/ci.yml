name: CI

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Build
        run: go build ./cmd/gchat-mentions
