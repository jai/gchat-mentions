version: 2

project_name: gchat-mentions

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gchat-mentions
    main: ./cmd/gchat-mentions
    binary: gchat-mentions
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "gchat-mentions_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jai
    name: gchat-mentions
